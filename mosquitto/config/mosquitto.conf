# Eclipse Mosquitto: the one local broker of Copper Canyon Dam (customer tree + CH tree).
# Plain MQTT on 1883 inside the compose network (published on the host as 1884), no auth:
# a local demo environment. Security (TLS, identities, ACLs) is what the edge vendors bring.
listener 1883
allow_anonymous true

# Keep retained messages (last values, nameplates, PLC status) across broker restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
