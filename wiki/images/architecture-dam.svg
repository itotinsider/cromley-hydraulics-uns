<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The end-user case: Copper Canyon Dam, operated by DRWPA</title>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ea5"/></marker>
    <marker id="aCopper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8692e"/></marker>
    <marker id="aViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker>
    <marker id="aWater" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b8db8"/></marker>
  </defs>

  <!-- own background, so it reads the same in GitHub's light and dark themes -->
  <rect x="0.5" y="0.5" width="999" height="559" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <text x="24" y="34" font-size="17" font-weight="600" fill="#24292f">Case 1 · The end user: Copper Canyon Dam (DRWPA)</text>
  <text x="24" y="54" font-size="12.5" fill="#57606a">How a dam is run: water in, power out, a control room that keeps it safe. The owner's data, in the owner's ISA-95 tree.</text>

  <!-- column headings -->
  <g font-size="12" font-weight="600" fill="#57606a">
    <text x="150" y="86" text-anchor="middle">THE DAM (PROCESS)</text>
    <text x="408" y="86" text-anchor="middle">CONTROL (DRWPA)</text>
    <text x="634" y="86" text-anchor="middle">SITE BROKER</text>
    <text x="866" y="86" text-anchor="middle">CONTROL ROOM</text>
  </g>

  <!-- the dam: a water path -->
  <rect x="24" y="98" width="252" height="306" rx="8" fill="#f2f6fa" stroke="#5b8db8" stroke-width="1.5"/>
  <g font-size="12.5" fill="#24292f">
    <rect x="40" y="112" width="220" height="30" rx="5" fill="#dfe9f3"/><text x="52" y="132">Reservoir 385–420 m · inflow</text>
    <rect x="40" y="156" width="220" height="30" rx="5" fill="#dfe9f3"/><text x="52" y="176">Intake gate · trash rack · raker</text>
    <rect x="40" y="200" width="220" height="30" rx="5" fill="#dfe9f3"/><text x="52" y="220">Penstock · 3 inlet valves</text>
    <rect x="40" y="244" width="220" height="44" rx="5" fill="#e3f1f1" stroke="#137a7f" stroke-width="1"/>
    <text x="52" y="263">3 × 40 MW Francis units</text>
    <text x="52" y="280" font-size="11" fill="#137a7f">turbines by Cromley Hydraulics</text>
    <rect x="40" y="302" width="220" height="30" rx="5" fill="#dfe9f3"/><text x="52" y="322">Tailrace → river</text>
    <rect x="40" y="346" width="104" height="44" rx="5" fill="#dfe9f3"/><text x="50" y="364" font-size="11.5">2 spillway</text><text x="50" y="380" font-size="11.5">gates</text>
    <rect x="156" y="346" width="104" height="44" rx="5" fill="#dfe9f3"/><text x="166" y="364" font-size="11.5">bottom</text><text x="166" y="380" font-size="11.5">outlet</text>
  </g>
  <g stroke="#5b8db8" stroke-width="1.6" marker-end="url(#aWater)">
    <line x1="150" y1="142" x2="150" y2="154"/><line x1="150" y1="186" x2="150" y2="198"/>
    <line x1="150" y1="230" x2="150" y2="242"/><line x1="150" y1="288" x2="150" y2="300"/>
  </g>

  <!-- controllers -->
  <rect x="306" y="98" width="204" height="190" rx="8" fill="#eef3f9" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="320" y="122" font-size="14.5" font-weight="600" fill="#24292f">Unit &amp; plant controllers</text>
  <g font-size="12" fill="#57606a">
    <text x="320" y="144">start/stop sequence, permissives</text>
    <text x="320" y="161">governor (speed, MW, droop)</text>
    <text x="320" y="178">unit protection: trips, first-out</text>
    <text x="320" y="195">plant controller: MW split,</text>
    <text x="320" y="211">AGC, stay out of the rough zone</text>
    <text x="320" y="228">spillway / outlet AUTO</text>
  </g>
  <text x="320" y="252" font-size="11" fill="#3a6ea5">simulated by dam-sim</text>
  <text x="320" y="268" font-size="11" fill="#3a6ea5">publishes the customer tree, 1 s</text>
  <!-- process <-> controllers -->
  <line x1="278" y1="160" x2="304" y2="160" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#aBlue)" marker-start="url(#aBlue)"/>
  <!-- hardwired -->
  <path d="M260,268 H290 V310 H360 V292" fill="none" stroke="#b8692e" stroke-width="2.2" marker-end="url(#aCopper)"/>
  <text x="300" y="328" font-size="12" font-weight="600" fill="#b8692e">hardwired from the turbines</text>
  <text x="300" y="344" font-size="11" fill="#57606a">bearing RTDs, cooling flow, oil pressure:</text>
  <text x="300" y="358" font-size="11" fill="#57606a">copper to the unit protection</text>

  <!-- broker -->
  <rect x="534" y="98" width="200" height="190" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="634" y="120" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24292f">Mosquitto</text>
  <rect x="546" y="132" width="176" height="144" rx="6" fill="#eef3f9" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="558" y="152" font-size="12.5" font-weight="600" fill="#3a6ea5">Customer tree</text>
  <text x="558" y="170" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#24292f">v1.0/DRWPA/CopperCanyon/</text>
  <g font-size="11.5" fill="#57606a">
    <text x="558" y="190">Reservoir, Intake, Penstock,</text>
    <text x="558" y="206">Powerhouse/Unit1…3,</text>
    <text x="558" y="222">Spillway, BottomOutlet, Plant</text>
    <text x="558" y="244">+ Cmd topics, Plant/Events</text>
    <text x="558" y="262" fill="#3a6ea5">owned by the dam operator</text>
  </g>
  <line x1="512" y1="170" x2="544" y2="170" stroke="#3a6ea5" stroke-width="1.8" marker-end="url(#aBlue)"/>
  <line x1="544" y1="230" x2="512" y2="230" stroke="#3a6ea5" stroke-width="1.8" marker-end="url(#aBlue)"/>
  <text x="516" y="246" font-size="10.5" fill="#3a6ea5">Cmd</text>

  <!-- SCADA -->
  <rect x="758" y="98" width="218" height="232" rx="8" fill="#eef3f9" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="772" y="122" font-size="14.5" font-weight="600" fill="#24292f">Dam SCADA <tspan font-weight="400" fill="#57606a">:8120/scada</tspan></text>
  <text x="772" y="140" font-size="11" fill="#57606a">high-performance HMI (ISA-101)</text>
  <g font-size="12" fill="#24292f">
    <text x="772" y="164">· overview and dam section</text>
    <text x="772" y="182">· water, powerhouse, single-line</text>
    <text x="772" y="200">· units: sequence, permissives,</text>
    <text x="786" y="216">first-out, operating chart</text>
    <text x="772" y="234">· alarms (ISA-18.2), sequence</text>
    <text x="786" y="250">of events, journal</text>
    <text x="772" y="268">· historian and trends (14 days)</text>
    <text x="772" y="286">· faceplates: every command</text>
  </g>
  <text x="772" y="316" font-size="11" fill="#3a6ea5">reads the customer tree only</text>
  <line x1="736" y1="170" x2="756" y2="170" stroke="#3a6ea5" stroke-width="1.8" marker-end="url(#aBlue)"/>
  <line x1="756" y1="230" x2="736" y2="230" stroke="#3a6ea5" stroke-width="1.8" marker-end="url(#aBlue)"/>

  <!-- grid operator -->
  <rect x="758" y="346" width="218" height="58" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.3"/>
  <text x="772" y="370" font-size="13.5" font-weight="600" fill="#24292f">Grid operator</text>
  <text x="772" y="388" font-size="11.5" fill="#57606a">MW setpoint + AGC, via the SCADA</text>
  <line x1="866" y1="346" x2="866" y2="332" stroke="#57606a" stroke-width="1.6"/>

  <!-- instructor -->
  <rect x="534" y="312" width="200" height="92" rx="8" fill="#f3effa" stroke="#6b4fa0" stroke-width="1.5"/>
  <text x="548" y="336" font-size="14" font-weight="600" fill="#24292f">Instructor <tspan font-weight="400" fill="#57606a">:8121</tspan></text>
  <text x="548" y="356" font-size="11.5" fill="#57606a">hidden faults: low reservoir,</text>
  <text x="548" y="372" font-size="11.5" fill="#57606a">flood, rough zone, trash, trips…</text>
  <text x="548" y="392" font-size="11" fill="#6b4fa0">HTTP, never on the broker</text>
  <path d="M534,330 H470 V292" fill="none" stroke="#6b4fa0" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#aViolet)"/>

  <!-- audience band -->
  <rect x="24" y="428" width="952" height="112" rx="8" fill="#fbfbfb" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="7 4"/>
  <text x="44" y="456" font-size="14" font-weight="600" fill="#24292f">For process experts, operations and maintenance, and anyone who wants to learn how a dam works</text>
  <g font-size="12.5" fill="#57606a">
    <text x="44" y="480">· start, stop and trip a unit; follow the sequence and see why a start is refused</text>
    <text x="44" y="500">· run the reservoir, spillway and bottom outlet; see why some MW setpoints can't be made (the rough zone)</text>
    <text x="44" y="520">· find a fault from the control room's alarms, trends and sequence of events, and see what the control room cannot see</text>
  </g>
</svg>
