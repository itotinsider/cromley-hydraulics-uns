<text x="566" y="136" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">Y proximity probe</text>
<text x="566" y="154" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#137a7f">Vibration/TGB/ShaftY/Overall_um_pp + /Waveform</text>
<text x="566" y="172" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">gap to the shaft surface, 1,000 samples/s</text>
<path d="M560,212 L410.6,300.5" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M560,212 L410.6,300.5" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="566" y="208" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">Pad 1: dual-element RTD</text>
<text x="566" y="226" font-size="12.5"><tspan font-weight="700" fill="#3a6ea5">A</tspan><tspan fill="#57606a"> hardwired to the customer: </tspan><tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#3a6ea5">TurbineGuideBearingTemp</tspan></text>
<text x="566" y="244" font-size="12.5"><tspan font-weight="700" fill="#137a7f">B</tspan><tspan fill="#57606a"> to the CH PLC: </tspan><tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#137a7f">Bearings/TGB/PadTemp01</tspan></text>
<text x="566" y="262" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">the only TGB temperature the control room (SCADA) sees</text>
<path d="M560,300 L428.9,367.9" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M560,300 L428.9,367.9" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="566" y="304" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">Oil film</text>
<text x="566" y="322" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">carries the load; a few hundredths of a mm thick</text>
<path d="M560,370 L554.0,400.0" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M560,370 L554.0,400.0" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="566" y="366" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">X proximity probe, 90° from Y</text>
<text x="566" y="384" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#137a7f">Vibration/TGB/ShaftX/Overall_um_pp + /Waveform</text>
<path d="M560,432 L496.9,467.4" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M560,432 L496.9,467.4" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="566" y="436" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">Housing + oil pot</text>
<text x="566" y="454" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#137a7f">Bearings/TGB/OilTemp · OilLevel</text>
<path d="M560,500 L420.5,490.5" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M560,500 L420.5,490.5" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="566" y="496" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">Pads 2, 3, 4: one RTD each, CH PLC only</text>
<text x="566" y="514" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#137a7f">Bearings/TGB/PadTemp02 … PadTemp04</text>
<text x="566" y="532" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">the customer has no sensor on these pads</text>
<path d="M70,378 L106.0,397.0" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M70,378 L106.0,397.0" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="24" y="334" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">Keyphasor</text>
<text x="24" y="352" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">notch on the shaft:</text>
<text x="24" y="368" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">one pulse per turn</text>
<path d="M90,620 L199.2,475.5" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M90,620 L199.2,475.5" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="24" y="636" font-size="13" font-weight="700" fill="#b8692e" text-anchor="start">Pad 3 in scenario A (Unit 1)</text>
<text x="24" y="656" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">set at 0.24 mm clearance in 2019 (design 0.30 ± 0.05 mm, concession</text>
<text x="24" y="672" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">CH-CON-2019-017): thinner film, more heat, first to suffer when the oil degrades</text>
<path d="M100,470 L212.3,507.7" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M100,470 L212.3,507.7" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="24" y="450" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">Pivot</text>
<text x="24" y="476" font-size="12" fill="#57606a">the pad tilts</text>
<line x1="24" y1="700" x2="1476" y2="700" stroke="#d0d7de"/>
<text x="24" y="730" font-size="14" font-weight="700" fill="#24292f" text-anchor="start">DETAIL B: ONE PAD, UNROLLED (shaft surface drawn flat)</text>
<rect x="300" y="742" width="760" height="34" fill="url(#hatch)" stroke="#24292f" stroke-width="1.5"/>
<path d="M716,776 Q740,800 764,776 Z" fill="#b9c0c8" stroke="#24292f" stroke-width="1.4"/>
<path d="M340,790 L1020,806 L1020,882 L340,856 Z" fill="url(#steel)" stroke="#24292f" stroke-width="1.6"/>
