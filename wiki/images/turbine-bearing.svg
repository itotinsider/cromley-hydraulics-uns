<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Turbine guide bearing: pads, oil film and sensors</title>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#f2f3f5"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8c959f" stroke-width="1"/></pattern>
    <pattern id="steel" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="7" height="7" fill="#dfe3e8"/><line x1="0" y1="0" x2="0" y2="7" stroke="#a3abb5" stroke-width="1"/></pattern>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#57606a"/></marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24292f"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8692e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="1499" height="999" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="38" font-size="20" font-weight="700" fill="#24292f">Turbine guide bearing (TGB): pads, oil film and sensors</text>
  <text x="24" y="60" font-size="13" fill="#57606a">Section A–A from the unit drawing, looking down, and detail B: one pad, unrolled. Not to scale: the oil film is drawn hundreds of times too thick.</text>
  <text x="24" y="100" font-size="14" font-weight="700" fill="#24292f">SECTION A–A</text>

