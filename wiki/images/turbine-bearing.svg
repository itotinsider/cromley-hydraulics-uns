<path d="M340,870 L1020,896 L1020,912 L340,912 Z" fill="#fbf1d0"/>
<rect x="250" y="912" width="860" height="40" fill="url(#hatch)" stroke="#24292f" stroke-width="1.6"/>
<line x1="300" y1="932" x2="460" y2="932" stroke="#24292f" stroke-width="2" marker-end="url(#arrK)"/>
<text x="470" y="937" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">shaft surface moves</text>
<line x1="250" y1="900" x2="290" y2="900" stroke="#b8692e" stroke-width="1.6" marker-end="url(#arrO)"/>
<line x1="300" y1="900" x2="340" y2="900" stroke="#b8692e" stroke-width="1.6" marker-end="url(#arrO)"/>
<line x1="420" y1="905" x2="470" y2="905" stroke="#b8692e" stroke-width="1.2" marker-end="url(#arrO)"/>
<line x1="560" y1="905" x2="610" y2="905" stroke="#b8692e" stroke-width="1.2" marker-end="url(#arrO)"/>
<line x1="700" y1="905" x2="750" y2="905" stroke="#b8692e" stroke-width="1.2" marker-end="url(#arrO)"/>
<line x1="840" y1="905" x2="890" y2="905" stroke="#b8692e" stroke-width="1.2" marker-end="url(#arrO)"/>
<rect x="902" y="800" width="10" height="70" fill="#ffffff" stroke="#24292f"/>
<circle cx="907" cy="869" r="5.5" fill="#137a7f" stroke="#ffffff" stroke-width="1.2"/>
<path d="M907,800 V742" fill="none" stroke="#137a7f" stroke-width="1.6"/>
<path d="M1110,752 L1060.0,758.0" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M1110,752 L1060.0,758.0" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="1116" y="756" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">Housing (fixed)</text>
<path d="M1110,784 L762.0,786.0" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M1110,784 L762.0,786.0" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="1116" y="788" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">Pivot: the pad tilts freely and finds its own wedge angle</text>
<path d="M1110,822 L1020.0,830.0" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M1110,822 L1020.0,830.0" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="1116" y="826" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">Steel pad</text>
<path d="M1110,864 L912.0,862.0" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M1110,864 L912.0,862.0" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="1116" y="860" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">RTD in a drilled hole, tip just behind the babbitt</text>
<text x="1116" y="876" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">(where the heat is made)</text>
<path d="M1110,890 L1020.0,889.0" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M1110,890 L1020.0,889.0" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="1116" y="898" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">Babbitt: a few mm of soft tin-based white metal.</text>
<text x="1116" y="914" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Wear shows as tin in the oil analysis.</text>
<path d="M1110,940 L1020.0,904.0" stroke="#ffffff" stroke-width="3.5" fill="none"/>
<path d="M1110,940 L1020.0,904.0" stroke="#57606a" stroke-width="1" fill="none" marker-end="url(#dot)"/>
<text x="1116" y="944" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">Oil film: the moving shaft drags oil into the</text>
<text x="1116" y="960" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">narrowing gap; the pressure there carries the load.</text>
<text x="1116" y="976" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Thinner film or oxidised oil: more heat, then metal contact.</text>
<text x="36" y="772" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">wide gap</text>
<text x="36" y="788" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">(oil in)</text>
<path d="M100,780 Q200,790 336,866" fill="none" stroke="#57606a" stroke-width="1" marker-end="url(#dot)"/>
<text x="130" y="980" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">narrow gap: the film is thinnest and hottest here →</text>
<path d="M420,975 Q900,975 1012,906" fill="none" stroke="#57606a" stroke-width="1" marker-end="url(#dot)"/>
<rect x="1000" y="84" width="476" height="512" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="1016" y="110" font-size="14" font-weight="700" fill="#24292f" text-anchor="start">Limits on a pad temperature</text>
<text x="1016" y="134" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">normal at full load: pads 60–70 °C, oil 50–60 °C</text>
<text x="1016" y="153" font-size="13" font-weight="400" fill="#137a7f" text-anchor="start">CH PLC (every pad): H 75 °C, HH 85 °C</text>
<text x="1016" y="172" font-size="13" font-weight="400" fill="#3a6ea5" text-anchor="start">customer (pad 1 only): alarm 80 °C, trip 90 °C</text>
<text x="1016" y="191" font-size="13" font-weight="400" fill="#57606a" text-anchor="start">babbitt softens from about 120–130 °C</text>
<text x="1016" y="225" font-size="14" font-weight="700" fill="#24292f" text-anchor="start">How a pad fails</text>
<text x="1016" y="249" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">1. The film thins: tight clearance, more load, or oil</text>
<text x="1016" y="268" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">   that has oxidised (TAN, varnish up).</text>
<text x="1016" y="287" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">2. More shear heat in the thinner film: the pad warms</text>
<text x="1016" y="306" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">   a few K over weeks, its neighbours less.</text>
<text x="1016" y="325" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">3. Babbitt starts to smear: tin appears in the oil.</text>
<text x="1016" y="344" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">4. Then fast: tens of K in hours, and a wiped bearing</text>
<text x="1016" y="363" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">   if the unit keeps running.</text>
<text x="1016" y="397" font-size="14" font-weight="700" fill="#b8692e" text-anchor="start">Scenario A on Unit 1</text>
<text x="1016" y="421" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">Pad 3 crossed 75 °C at 23:54 and 85 °C at 09:00.</text>
<text x="1016" y="440" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">Pads 2 and 4 rose a few K, the oil about 2 K.</text>
<text x="1016" y="459" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">Pad 1, the customer's sensor, stayed near 70 °C:</text>
<text x="1016" y="478" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">no SCADA alarm. Only the CH viewer showed it.</text>
<text x="1016" y="512" font-size="14" font-weight="700" fill="#24292f" text-anchor="start">Why a sensor on every pad</text>
<text x="1016" y="536" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">A real pad problem warms its neighbours and the oil.</text>
<text x="1016" y="555" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">One pad moving alone, with flat neighbours, points to</text>
<text x="1016" y="574" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">the sensor instead (scenario G).</text>
</svg>